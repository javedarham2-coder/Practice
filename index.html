<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Modern calculator application with glassmorphism design" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="calculator.js"></script>
  </head>
  <body>
    <main class="frame">
      <div class="iphone-pro-x" aria-hidden="true"></div>
      <section class="div" role="application" aria-label="Calculator">
        <output class="text-wrapper-6" aria-live="polite" aria-atomic="true">=12,454</output>
        <p class="element" aria-label="Calculation history">
          <span class="span">6000</span>
          <span class="text-wrapper-7">/</span>
          <span class="span">2</span>
          <span class="text-wrapper-7">+</span>
          <span class="span">3227</span>
          <span class="text-wrapper-7">*</span>
          <span class="span">2</span>
        </p>
        <button class="div-wrapper-14" type="button" aria-label="All Clear">
          <span class="text-wrapper-5">Ac</span>
        </button>
        <button class="vector-wrapper" type="button" aria-label="Backspace">
          <img class="vector" src="img/vector.svg" alt="" />
        </button>
        <button class="img-wrapper" type="button" aria-label="Divide">
          <img class="img" src="img/image.svg" alt="" />
        </button>
        <button class="group-2" type="button" aria-label="Multiply">
          <img class="img-2" src="img/svg.png" alt="" />
        </button>
        <button class="div-wrapper-9" type="button" aria-label="7">
          <span class="text-wrapper-4">7</span>
        </button>
        <button class="div-wrapper-10" type="button" aria-label="8">
          <span class="text-wrapper-4">8</span>
        </button>
        <button class="div-wrapper-8" type="button" aria-label="9">
          <span class="text-wrapper-4">9</span>
        </button>
        <button class="div-wrapper-7" type="button" aria-label="Subtract">
          <span class="text-wrapper">-</span>
        </button>
        <button class="div-wrapper-12" type="button" aria-label="4">
          <span class="text-wrapper-4">4</span>
        </button>
        <button class="div-wrapper-13" type="button" aria-label="5">
          <span class="text-wrapper-4">5</span>
        </button>
        <button class="div-wrapper-11" type="button" aria-label="6">
          <span class="text-wrapper-4">6</span>
        </button>
        <button class="div-wrapper-3" type="button" aria-label="Add">
          <span class="text-wrapper-3">+</span>
        </button>
        <button class="div-wrapper-5" type="button" aria-label="1">
          <span class="text-wrapper-4">1</span>
        </button>
        <button class="div-wrapper-6" type="button" aria-label="2">
          <span class="text-wrapper-4">2</span>
        </button>
        <button class="div-wrapper-4" type="button" aria-label="3">
          <span class="text-wrapper-4">3</span>
        </button>
        <button class="div-wrapper" type="button" aria-label="0">
          <span class="text-wrapper">0</span>
        </button>
        <button class="group" type="button" aria-label="Decimal point">
          <span class="rectangle"></span>
        </button>
        <button class="div-wrapper-15" type="button" aria-label="Equals">
          <span class="text-wrapper-2">=</span>
        </button>
      </section>
      <div class="ellipse" aria-hidden="true"></div>
      <div class="ellipse-2" aria-hidden="true"></div>
    </main>
  </body>
</html>
